<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="김이 올라오는 찻잔 일러스트">
  <defs>
    <radialGradient id="plate" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fbfaf5" />
      <stop offset="100%" stop-color="#f2efe6" />
    </radialGradient>
  </defs>

  <!-- 뒷배경 원형 접시 -->
  <circle cx="200" cy="210" r="150" fill="url(#plate)" stroke="#1c1a17" stroke-width="2" />
  <circle cx="200" cy="210" r="134" fill="none" stroke="#1c1a1755" stroke-width="1" stroke-dasharray="2 6" />

  <!-- 받침 접시 -->
  <ellipse cx="200" cy="300" rx="130" ry="26" fill="#fbfaf5" stroke="#1c1a17" stroke-width="3" />
  <ellipse cx="200" cy="296" rx="92" ry="14" fill="none" stroke="#1c1a17" stroke-width="2" />

  <!-- 찻숟가락 -->
  <g transform="rotate(18 260 292)">
    <ellipse cx="258" cy="276" rx="9" ry="14" fill="#f2efe6" stroke="#1c1a17" stroke-width="2.5" />
    <rect x="254" y="286" width="7" height="46" rx="3.5" fill="#f2efe6" stroke="#1c1a17" stroke-width="2.5" />
  </g>

  <!-- 찻잔 몸체 -->
  <path d="M110 200 q0 70 90 70 q90 0 90 -70 z" fill="#2a2824" stroke="#1c1a17" stroke-width="3" />
  <path d="M110 200 q0 70 90 70 q90 0 90 -70" fill="none" stroke="#8f887c" stroke-width="2" opacity="0.6" />

  <!-- 찻잔 안쪽(차) -->
  <ellipse cx="200" cy="200" rx="90" ry="20" fill="#0d0c0a" stroke="#1c1a17" stroke-width="3" />
  <ellipse cx="200" cy="197" rx="74" ry="12" fill="#262420" opacity="0.8" />

  <!-- 찻잔 테두리 라인 장식 -->
  <path d="M118 214 q82 26 164 0" fill="none" stroke="#f2efe6" stroke-width="3" stroke-linecap="round" />
  <path d="M122 230 q78 22 156 0" fill="none" stroke="#f2efe6" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- 손잡이 -->
  <path d="M290 215 q40 5 40 32 q0 28 -38 28" fill="none" stroke="#1c1a17" stroke-width="7" stroke-linecap="round" />
  <path d="M290 215 q40 5 40 32 q0 28 -38 28" fill="none" stroke="#8f887c" stroke-width="3" stroke-linecap="round" />

  <!-- 김 -->
  <path d="M168 170 q-10 -22 4 -40 q12 -16 0 -34" fill="none" stroke="#1c1a17" stroke-width="3" stroke-linecap="round" opacity="0.45" />
  <path d="M200 160 q-10 -24 4 -44 q12 -18 0 -38" fill="none" stroke="#1c1a17" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <path d="M232 170 q-10 -22 4 -40 q12 -16 0 -34" fill="none" stroke="#1c1a17" stroke-width="3" stroke-linecap="round" opacity="0.45" />

  <!-- 반짝임 장식 -->
  <g fill="#8f887c">
    <path d="M70 110 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" />
    <path d="M330 150 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" />
    <path d="M90 300 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" />
  </g>
</svg>
